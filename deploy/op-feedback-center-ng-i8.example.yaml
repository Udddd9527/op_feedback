apiVersion: v1
kind: ConfigMap
metadata:
  name: op-feedback-center-config
  namespace: ng-i8
  labels:
    k8s-app: op-feedback-center
data:
  NODE_ENV: "production"
  PORT: "4173"
  ORACLE_CONNECT_STRING: "host:port/service_name"
  ORACLE_POOL_MIN: "1"
  ORACLE_POOL_MAX: "8"
  ORACLE_QUEUE_TIMEOUT: "5000"
  ORACLE_PING_TIMEOUT: "3000"
  ORACLE_CONNECT_TIMEOUT: "5"
  ORACLE_TRANSPORT_TIMEOUT: "3"
  ORACLE_CALL_TIMEOUT: "10000"
---
apiVersion: v1
kind: Secret
metadata:
  name: op-feedback-center-secret
  namespace: ng-i8
  labels:
    k8s-app: op-feedback-center
type: Opaque
stringData:
  ORACLE_USER: "replace-me"
  ORACLE_PASSWORD: "replace-me"
  AUTH_SECRET: "replace-with-at-least-32-random-characters"
  AI_CRON_SECRET: "replace-with-another-random-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-feedback-center
  namespace: ng-i8
  labels:
    k8s-app: op-feedback-center
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s-app: op-feedback-center
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        k8s-app: op-feedback-center
    spec:
      imagePullSecrets:
        - name: ng-cloud
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: op-feedback-center
          image: newgrand-up-registry.cn-hangzhou.cr.aliyuncs.com/newgrand_i8/op-feedback-center:1.0.0-20261113
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: op-feedback-center-config
            - secretRef:
                name: op-feedback-center-secret
          ports:
            - name: http-4173
              containerPort: 4173
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http-4173
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-4173
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-4173
              scheme: HTTP
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 8
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: tmp
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: op-feedback-center
  namespace: ng-i8
  labels:
    k8s-app: op-feedback-center
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: tcp-4173
      port: 4173
      protocol: TCP
      targetPort: http-4173
  selector:
    k8s-app: op-feedback-center
  sessionAffinity: None
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: op-feedback-center-ai-scan
  namespace: ng-i8
  labels:
    k8s-app: op-feedback-center
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            k8s-app: op-feedback-center-ai-scan
        spec:
          imagePullSecrets:
            - name: ng-cloud
          restartPolicy: OnFailure
          containers:
            - name: ai-scan
              image: newgrand-up-registry.cn-hangzhou.cr.aliyuncs.com/newgrand_i8/op-feedback-center:1.0.0-20261113
              imagePullPolicy: IfNotPresent
              env:
                - name: AI_CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: op-feedback-center-secret
                      key: AI_CRON_SECRET
              command:
                - node
                - -e
                - >-
                  fetch("http://op-feedback-center:4173/api/internal/ai-scan", {
                    method: "POST",
                    headers: { "x-ai-cron-secret": process.env.AI_CRON_SECRET }
                  }).then(async response => {
                    const body = await response.text();
                    if (!response.ok) throw new Error(`${response.status}: ${body}`);
                    console.log(body);
                  }).catch(error => { console.error(error); process.exit(1); });
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 10001
                runAsNonRoot: true
                runAsUser: 10001
                seccompProfile:
                  type: RuntimeDefault
