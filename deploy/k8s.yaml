apiVersion: v1
kind: ConfigMap
metadata:
  name: op-feedback-config
data:
  PORT: "4173"
  ORACLE_CONNECT_STRING: "host:port/service_name"
  ORACLE_POOL_MIN: "1"
  ORACLE_POOL_MAX: "8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-feedback
spec:
  replicas: 2
  selector:
    matchLabels:
      app: op-feedback
  template:
    metadata:
      labels:
        app: op-feedback
    spec:
      containers:
        - name: web
          image: your-registry/op-feedback:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
          envFrom:
            - configMapRef:
                name: op-feedback-config
            - secretRef:
                name: op-feedback-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: op-feedback
spec:
  selector:
    app: op-feedback
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: op-feedback-ai-scan
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scan
              image: curlimages/curl:8.10.1
              env:
                - name: AI_CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: op-feedback-secret
                      key: AI_CRON_SECRET
              command:
                - sh
                - -ec
                - >-
                  curl --fail --silent --show-error --request POST
                  --header "X-AI-Cron-Secret: ${AI_CRON_SECRET}"
                  http://op-feedback/api/internal/ai-scan
